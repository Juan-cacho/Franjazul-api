# application-prod.properties
# Perfil de producción (Render)
spring.config.activate.on-profile=prod

# Database URL desde variable de entorno de Render
spring.datasource.url=${DATABASE_URL}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# Puerto desde variable de entorno de Render
server.port=${PORT:8080}

# Logging mínimo en producción
logging.level.root=INFO
logging.level.com.franjazul.api=INFO

# JWT desde variables de entorno
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

# CORS desde variable de entorno
cors.allowed-origins=${FRONTEND_URL}

# Configuración de archivos
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null

# Optimizaciones para Render free tier
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
server.tomcat.connection-timeout=120000
